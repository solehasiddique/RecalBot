<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/study.css">
</head>

<body>
    <header id="navbar-container"></header>


    <main id="main">
        <div class="container" id="screen">
            <h1 id="title">Ready to Focus?🙌</h1>
            <p class="subtitle" id="subtitle">AI will personalize your session</p>
            <div class="badge" id="badge">Loading...</div>

            <div id="timerSection" class="hidden">
                <div class="music"><span>🎵</span><span id="music"></span>
                    <div class="bars">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                </div>
                <div class="timer" id="timer">25:00</div>
                <div class="progress">
                    <div class="progress-bar" id="progress"></div>
                </div>
            </div>

            <div id="buttons"></div>
        </div>

    </main>
    <footer>
        <div class="footer-container">

            <!-- LEFT SIDE -->
            <div class="footer-left">
                <h3 class="footer-logo">RecallBot</h3>
                <p class="tagline">Smarter Recall. Stronger Memory.</p>
                <p class="badges">AI Powered • Research-Based • Student Focused</p>
                <p class="copyright">© 2025 RecallBot</p>
            </div>

            <!-- RIGHT -->
            <div class="footer-right">
                <h4>Get in Touch</h4>
                <!-- <p class="email">support@recallbot.ai</p> -->

                <div class="socials">
                    <a href="#">GitHub</a>
                    <a href="#">LinkedIn</a>
                    <a href="#">Twitter</a>
                    <a href="#">Email</a>
                </div>
            </div>

        </div>

        <!-- MARQUEE INSIDE FOOTER -->
        <div class="footer-marquee">
            <p class="marquee-text">

                AI DRIVEN PERSONALIZED LEARNING AND MEMORY RETENTION SYSTEM
            </p>
        </div>
    </footer>

    <!-- <img src="../images/logo.png" class="img" > -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

    <script src="../js/scriptForStudy.js"></script>
    <script src="../js/scriptForAnimation.js"></script>
    <script src="../js/navbarLoader.js"></script>
</body>

</html>
