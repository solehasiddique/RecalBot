<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Questionary Page</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/questionary.css">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header id="navbar-container"></header>

  <!-- ================= MAIN ================= -->
  <main>
    <div class="questionnaire-container">

      <!-- ===== Progress Section ===== -->
      <div class="progress-container">
        <div class="progress-text">
          <span class="current-question">
            Question <span id="currentQ">1</span> of 10
          </span>
          <span id="progressPercent">10%</span>
        </div>

        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar" style="width: 10%;"></div>
        </div>
      </div>

      <!-- ===== Question Area ===== -->
      <div class="question-display" id="questionDisplay">
        <!-- JS injects question here -->
      </div>

      <!-- ===== Navigation ===== -->
      <div class="navigation-buttons">
        <!-- ❗ disabled REMOVED -->
        <button
          class="btn btn-prev"
          id="prevBtn"
          type="button"
          onclick="previousQuestion()"
        >
          Previous
        </button>
        <div id="submitPlaceholder"></div>
      </div>

    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer>
    <div class="footer-container">

      <!-- Left -->
      <div class="footer-left">
        <h3 class="footer-logo">RecallBot</h3>
        <p class="tagline">Smarter Recall. Stronger Memory.</p>
        <p class="badges">AI Powered • Research-Based • Student Focused</p>
        <p class="copyright">© 2025 RecallBot</p>
      </div>

      <!-- Right -->
      <div class="footer-right">
        <h4>Get in Touch</h4>
        <div class="socials">
          <a href="https://github.com/alviya2005/FinalYearProject" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://www.linkedin.com/in/kunalbawliya/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="mailto:kunalbawliya1301@gmail.com" target="_blank" rel="noopener noreferrer">Email</a>
        </div>
      </div>

    </div>

    <!-- Marquee -->
    <div class="footer-marquee">
      <p class="marquee-text">
        AI DRIVEN PERSONALIZED LEARNING AND MEMORY RETENTION SYSTEM
      </p>
    </div>
  </footer>

  <!-- ================= SCRIPTS ================= -->
   <script src="../config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

  <script src="../js/scriptForAnimation.js"></script>
  <script src="../js/scriptForQuestionary.js"></script>
  <script src="../js/navbarLoader.js"></script>
</body>
</html>
